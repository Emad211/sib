# Relay VPS (O05): pass TLS through by SNI, never terminate it. No certificate and no key live here.
# Only the clinic's public name is forwarded; any other name or a probe without SNI is dropped.
# Install: /etc/haproxy/haproxy.cfg, then `systemctl reload haproxy`. Replace shift.clinic.example.
global
    log /dev/log local0
    maxconn 512
    user haproxy
    group haproxy
    daemon

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client 1h
    timeout server 1h

frontend public_tls
    bind :443
    # Wait for the ClientHello so the SNI can be read; a client that sends nothing is dropped.
    tcp-request inspect-delay 5s
    tcp-request content accept if { req.ssl_hello_type 1 }
    tcp-request content reject unless { req.ssl_hello_type 1 }
    use_backend clinic_shift if { req.ssl_sni -i shift.clinic.example }
    default_backend drop

backend clinic_shift
    # Rathole exposes the clinic PC's HTTPS port here, on the VPS loopback only.
    server clinic 127.0.0.1:7443

backend drop
    tcp-request content reject
