<!DOCTYPE html>
<html lang="fa-IR" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="description" content="سامانهٔ مدیریت و تحویل شیفت درمانگاه">
  <meta name="csrf-token" content="{{ csrf_token | default('') }}">

  <title>{% block title %}شیفت{% endblock %}</title>

  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/icons/192.png">
  <link rel="stylesheet" href="/static/app.css">
  {% block extra_head %}{% endblock %}
</head>
<body>
  <!-- Offline/Online Status Notification Banner -->
  <div id="network-banner" class="network-banner hidden" role="status" aria-live="polite"></div>

  <!-- Header -->
  <header class="app-header">
    <div class="header-inner">
      <a href="/" class="brand" aria-label="صفحه اصلی شیفت">
        <img src="/static/icons/192.png" alt="لوگو" class="brand-icon">
        <span>شیفت</span>
      </a>

      <div class="status-bar">
        <span id="who-am-i" class="who-am-i hidden"></span>
        <button id="logout-btn" type="button" class="logout-btn hidden">خروج</button>
        <span id="stale-badge" class="badge badge-stale hidden" role="note" aria-live="polite"></span>
        <span id="outbox-count-badge" class="badge badge-queued hidden" role="status"></span>
        <span id="connection-status-badge" class="badge badge-online">آنلاین</span>
      </div>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="main-container" id="main-content">
    {% if request is defined and request.url.path != "/" %}<a class="back-home" href="/">→ بازگشت به کارهای من</a>{% endif %}
    {% block content %}{% endblock %}
  </main>

  <script id="outbox-labels" type="application/json">{{ outbox_labels_json() | safe }}</script>

  <!-- Scripts -->
  <script src="/static/csrf.js"></script>
  <script src="/static/outbox-idb.js"></script>
  <script src="/static/app.js"></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
