<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>خطا {{ status }} — شیفت</title>
  <link rel="stylesheet" href="/static/app.css">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--color-bg);
           color: var(--color-text); font-family: var(--font-sans); }
    main { width: min(22rem, 92vw); background: var(--color-surface); padding: 1.75rem; border-radius: .75rem;
           box-shadow: 0 8px 24px rgba(15, 23, 42, .08); text-align: center; }
    .status { font-size: 2.4rem; font-weight: 700; color: #b42318; margin: 0; }
    .message { line-height: 1.8; font-size: .95rem; margin: .75rem 0 1.25rem; }
    a { color: var(--color-primary-button); text-decoration: none; font-size: .95rem; }
  </style>
</head>
<body>
  <main>
    <p class="status">{{ status }}</p>
    <p class="message">{{ message }}</p>
    <a href="/login">بازگشت به صفحهٔ ورود</a>
  </main>
</body>
</html>
