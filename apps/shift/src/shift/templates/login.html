<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ورود — شیفت سیب</title>
  <meta name="csrf-token" content="{{ csrf_token }}">
  <style>
    :root { color-scheme: light; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
           font-family: system-ui, "Segoe UI", Tahoma, sans-serif; background: #f4f6f8; color: #1f2933; }
    main { width: min(22rem, 92vw); background: #fff; padding: 1.75rem; border-radius: .75rem;
           box-shadow: 0 8px 24px rgba(15, 23, 42, .08); }
    h1 { margin: 0 0 1.25rem; font-size: 1.15rem; }
    label { display: block; margin: .75rem 0 .3rem; font-size: .9rem; }
    input { width: 100%; padding: .6rem .7rem; font-size: 1rem; border: 1px solid #cbd2d9;
            border-radius: .5rem; box-sizing: border-box; direction: ltr; text-align: center; }
    button { width: 100%; margin-top: 1.1rem; padding: .7rem; font-size: 1rem; border: 0;
             border-radius: .5rem; background: #1f6feb; color: #fff; cursor: pointer; }
    button:disabled { background: #8ea6c8; cursor: progress; }
    #message { min-height: 1.2rem; margin: .9rem 0 0; font-size: .88rem; color: #b42318; }
    #message.ok { color: #067647; }
    .hint { margin: 1.1rem 0 0; font-size: .78rem; color: #616e7c; line-height: 1.5; }
  </style>
</head>
<body data-next="{{ next_path }}">
  <main>
    <h1>ورود به شیفت</h1>
    <form id="login-form" novalidate>
      <label for="mobile">شمارهٔ موبایل</label>
      <input id="mobile" name="mobile" inputmode="numeric" autocomplete="username" required>
      <label for="pin">رمز شش‌رقمی</label>
      <input id="pin" name="pin" type="password" inputmode="numeric" autocomplete="current-password"
             maxlength="6" required>
      <button id="submit" type="submit">ورود</button>
      <p id="message" role="status"></p>
    </form>
    <p class="hint">رمز فقط روی گوشیی کار می‌کند که قبلاً با کد ثبت دستگاه جفت شده باشد.</p>
  </main>
  <script>
    const csrfToken = document.querySelector('meta[name="csrf-token"]').content;
    const deviceId = localStorage.getItem("shift_device_id") || "";
    const form = document.getElementById("login-form");
    const button = document.getElementById("submit");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.className = "";
      message.textContent = "";
      if (!deviceId) {
        message.textContent = "این گوشی ثبت نشده است؛ ابتدا کد ثبت دستگاه را اسکن کنید.";
        return;
      }
      button.disabled = true;
      try {
        const response = await fetch("/api/v1/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-CSRFToken": csrfToken },
          body: JSON.stringify({
            mobile: form.mobile.value,
            pin: form.pin.value,
            device_id: deviceId,
          }),
        });
        const body = await response.json().catch(() => ({}));
        if (!response.ok) {
          message.textContent = (body.error && body.error.message) || "ورود ناموفق بود.";
          return;
        }
        const next = document.body.dataset.next;
        if (next && next !== "/") { location.assign(next); return; }
        if (body.permissions.includes("device.enroll")) { location.assign("/admin/devices"); return; }
        message.className = "ok";
        message.textContent = "ورود انجام شد.";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
