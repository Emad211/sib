{# Flash messages for pages that have no layout of their own (tariff pages). Self-contained. #}
{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
  <style>
    .sib-flash-list { max-width: 1100px; margin: 0 auto 1rem; padding: 0 1rem; }
    .sib-flash { padding: .75rem 1rem; border-radius: 12px; margin-bottom: .5rem; font-size: .9rem; font-family: inherit; }
    .sib-flash.success { background: rgba(16,185,129,.2); color: #6ee7b7; border: 1px solid rgba(16,185,129,.3); }
    .sib-flash.error { background: rgba(239,68,68,.2); color: #fca5a5; border: 1px solid rgba(239,68,68,.3); }
    .sib-flash.message, .sib-flash.info { background: rgba(99,102,241,.2); color: #c7d2fe; border: 1px solid rgba(99,102,241,.3); }
  </style>
  <div class="sib-flash-list" role="status">
    {% for category, message in messages %}
    <div class="sib-flash {{ category }}">{{ message }}</div>
    {% endfor %}
  </div>
  {% endif %}
{% endwith %}
