<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}</title>
<style>
  @font-face { font-family: Vazirmatn; src: url("{{ url_for('static', filename='fonts/Vazirmatn-Regular.woff2') }}") format("woff2"); }
  :root { --ink:#0b2a1c; --muted:#4d6a58; --bg:#f7f3ea; --card:#fffdf8; --line:rgba(11,42,28,.12); --accent:#1b9157; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink);
         font-family: Vazirmatn, Tahoma, sans-serif; padding:16px; }
  .card { max-width:460px; width:100%; background:var(--card); border:1px solid var(--line); border-radius:20px;
          padding:28px; box-shadow:0 20px 40px -24px rgba(11,42,28,.35); }
  .code { font-size:13px; color:var(--muted); letter-spacing:.05em; }
  h1 { font-size:20px; margin:6px 0 10px; }
  p { color:var(--muted); line-height:1.9; margin:0 0 18px; }
  .ref { font-family: Consolas, monospace; direction:ltr; display:inline-block; background:#efe8d8; padding:2px 8px; border-radius:6px; }
  a.btn { display:inline-block; background:var(--accent); color:#fff; text-decoration:none; padding:10px 18px; border-radius:12px; }
</style>
</head>
<body>
  <main class="card">
    <div class="code">خطای {{ code|fa_num }}</div>
    <h1>{{ title }}</h1>
    <p>{{ message }}</p>
    {% if ref %}<p>کد پیگیری برای پشتیبانی: <span class="ref">{{ ref }}</span></p>{% endif %}
    <a class="btn" href="{{ url_for('index') }}">بازگشت به صفحهٔ اصلی</a>
  </main>
</body>
</html>
