[pytest]
testpaths = tests
markers =
    prod_snapshot: uses a copy of the real production DB from sib/_data (local only, never in CI)
# Disk hygiene: production-snapshot copies are ~110 MB each.
tmp_path_retention_count = 1
tmp_path_retention_policy = failed
addopts = -m "not prod_snapshot" -p no:cacheprovider
filterwarnings =
    ignore:datetime.datetime.utcnow\(\) is deprecated:DeprecationWarning
