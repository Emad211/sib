# Lint only code written under the new standards (E01). Legacy src/ is brought in
# file by file as it is refactored in phase 2 (A05) — add each cleaned path here.
line-length = 120
target-version = "py313"
include = [
    "tools/**/*.py",
    "tests/test_route_matrix.py",
    "tests/test_acc_audit_fixes.py",
    "tests/test_prod_snapshot.py",
    "tests/test_migrations.py",
    "tests/test_backup.py",
    "tests/test_auth_security.py",
    "tests/test_errors_logging.py",
    "tests/test_bugfixes_phase1.py",
    "src/config/logging_setup.py",
    "start.py",
    "tests/test_inline_scripts.py",
    "tools/run_synthetic.py",
    "src/__version__.py",
    "src/web/**/*.py",
    "tests/test_csrf.py",
    "src/config/settings.py",
    "src/adapters/sqlite/core.py",
    "src/adapters/sqlite/migrations/**/*.py",
    "src/services/backup.py",
    "src/services/scheduler.py",
    "src/services/exports.py",
    "src/services/manager_insights.py",
    "src/services/tariff_audit.py",
    "src/domain/**/*.py",
    "src/common/validators.py",
    "tests/test_domain.py",
    "tests/test_payment_rules.py",
    "tests/test_shift_contract.py",
    "tests/test_shift_handover.py",
    "tests/test_reception_ux.py",
    "tests/test_procedures_catalog.py",
    "tests/test_manager_finance.py",
    "src/services/manager_finance.py",
    "src/api/manager/expenses.py",
    "src/services/shift_handover.py",
    "src/services/patient_matching.py",
    "tests/test_manager_part2.py",
    "tests/test_exports.py",
    "tests/test_manager_insights.py",
    "tests/test_retired_doctor_role.py",
    "tests/test_manager_authz.py",
    # ACC-2.6: manager package. Left out (SQL strings with trailing spaces W291, unused locals F841/F541,
    # fixing them would touch behaviour/queries): dashboard.py, exports.py, payroll.py
    "src/api/manager/__init__.py",
    "src/api/manager/_common.py",
    "src/api/manager/arrears.py",
    "src/api/manager/logs.py",
    "src/api/manager/reports.py",
    "src/api/manager/settings.py",
    "src/api/manager/tariffs.py",
    "src/api/manager/users.py",
    "src/services/auth_service.py",
]

[lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
